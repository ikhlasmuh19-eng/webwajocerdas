<script>

const KEC=['Tempe','Pitumpanua','Belawa','Maniangpajo','Pammana','Sabbangparu','Tanasitolo','Majauleng','Takkalalla','Sajoanging','Penrang','Bola','Keera','Gilireng'];

  ['hero_desc','Deskripsi','area','Pemerintah Kabupaten Wajo melalui Dinas Pendidikan dan Kebudayaan menyinergikan seluruh Satgas Kecamatan, UPTD Sekolah, serta Pemerintah Desa untuk mendeteksi, mendampingi, dan mengembalikan anak usia 7–18 tahun ke bangku sekolah formal maupun pendidikan kesetaraan PKBM.'],

 {t:'Indikator Utama (KPI)',note:'Mode "otomatis" menghitung dari Master Data. Mode "manual" memakai angka di bawah.',f:[

  ['kpi_kembali_persen','Label persen kembali (manual)','text','Anak (33,7%)'],['kpi_cakupan','Cakupan wilayah','text','100%'],
  ['kpi_cakupan_desc','Keterangan cakupan','text','190 Desa & Kelurahan terhubung sistem pelaporan lapangan.'],['kpi_sla','Standar layanan (SLA)','text','< 48 Jam'],

 {t:'Catatan Lapangan Pokja',f:[['catatan_lokasi','Lokasi','text','KECAMATAN TEMPE, KAB. WAJO'],
  ['catatan_quote','Kutipan cerita','area','"Andi R. (14 tahun) sempat 2 tahun berhenti sekolah untuk membantu memetik cabai di kebun demi menopang keluarga. Melalui laporan kepala dusun di portal SIP-ATS Wajo, kini ia telah terdaftar kembali di SMP Terbuka Sengkang dengan bantuan beasiswa perlengkapan penuh."'],
  ['catatan_sumber','Sumber / penutur','text','— Koordinator Satgas ATS UPTD Pendidikan Wilayah Tempe'],['catatan_foto_url','URL foto (https://…)','url','']]},
 {t:'Kontak & Alamat (tampil di kartu kontak, formulir laporan, dan footer)',f:[['kontak_call','Teks Call Center (Beranda)','text','(0485) 21102 / Layanan ATS'],['kontak_telp','Telepon kantor (formulir)','text','(0485) 21102'],
  ['kontak_wa','WhatsApp Satgas (formulir)','text','0811-4200-989'],['alamat','Alamat footer','area','Jl Jend Ahmad Yani, Paddupa, Kec. Tempe, Kabupaten Wajo, Sulawesi Selatan 90914.']]}
];

const S={api:'',token:'',user:null,view:'ringkasan',q:{status:'SEMUA',search:'',kecamatan:'',page:1},m:{search:'',kecamatan:'',status:'',page:1},cache:{}};
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Number(n||0).toLocaleString('id-ID');
const fmtDT=i=>{const d=new Date(i);return isNaN(d)?esc(i):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});};
const age=t=>{const d=new Date(String(t).slice(0,10));if(isNaN(d))return '-';const n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a;};
const val=id=>{const e=$(id);return e?(e.type==='checkbox'?e.checked:e.value.trim()):'';};
const opt=(arr,sel,blank)=>(blank!==undefined?`<option value="">${esc(blank)}</option>`:'')+arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const inp='w-full border border-slate-300 rounded px-3 py-2 text-sm bg-white';
const lbl='text-xs font-semibold text-slate-700 block mb-1';
const btn='text-xs font-semibold rounded px-3 py-2 ';
const btnP=btn+'bg-civic-600 hover:bg-blue-800 text-white disabled:opacity-50', btnO=btn+'border border-slate-200 hover:bg-slate-50 bg-white', btnD=btn+'border border-red-200 text-red-700 bg-red-50 hover:bg-red-100';

function toast(msg,err){const t=document.createElement('div');t.className='px-4 py-2.5 rounded shadow-lg text-xs font-semibold text-white '+(err?'bg-red-600':'bg-emerald-600');t.textContent=msg;$('toast').appendChild(t);setTimeout(()=>t.remove(),3500);}
function openModal(title,body,foot){$('mTitle').textContent=title;$('mBody').innerHTML=body;$('mFoot').innerHTML=foot||'';$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}

async function api(action,body){
  let res;
  try{res=await fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.token},body||{}))});}
  catch(e){throw new Error('Tidak dapat terhubung ke server. Periksa URL Web App dan koneksi internet.');}
  let j;try{j=await res.json();}catch(e){throw new Error('Respons server tidak valid. Pastikan URL Web App benar dan akses diset "Anyone".');}
  if(j.code==='SESI_HABIS'){logout(true);throw new Error('Sesi berakhir, silakan masuk kembali.');}
  if(j.error)throw new Error(j.error);
  return j;
}
async function act(fn,okMsg){try{const r=await fn();if(okMsg)toast(okMsg);return r;}catch(e){toast(e.message,true);return null;}}

// ---------- AUTH ----------
function showLogin(msg){$('app').classList.add('hidden');$('app').classList.remove('lg:flex');$('loginScreen').classList.remove('hidden');if(msg){$('loginErr').textContent=msg;$('loginErr').classList.remove('hidden');}}
function enterApp(){
  $('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('app').classList.add('lg:flex');
  $('uName').textContent=S.user.nama;$('uRole').textContent=S.user.role;
  $('nav').innerHTML=NAV.filter(n=>n.roles.includes(S.user.role)).map(n=>`<a href="#${n.id}" data-v="${n.id}" class="nav-i flex items-center gap-3 px-3 py-2.5 rounded text-sm text-slate-300 hover:bg-civic-850"><span class="material-symbols-outlined">${n.icon}</span>${esc(n.label)}</a>`).join('');
  const first=NAV.find(n=>n.roles.includes(S.user.role)).id, h=location.hash.slice(1);
  go(NAV.some(n=>n.id===h&&n.roles.includes(S.user.role))?h:first);
}
async function doLogin(){
  if(!S.api){showLogin('Konfigurasi koneksi server tidak tersedia. Hubungi pengelola situs.');return;}
  $('btnLogin').disabled=true;$('loginErr').classList.add('hidden');
  try{const r=await api('login',{username:val('lUser'),password:$('lPass').value});
    if(!r.success)throw new Error(r.error);
    S.token=r.token;S.user=r.user;sessionStorage.setItem('sipats_tok',r.token);sessionStorage.setItem('sipats_user',JSON.stringify(r.user));enterApp();
  }catch(e){showLogin(e.message);}finally{$('btnLogin').disabled=false;$('lPass').value='';}
}
function logout(silent){
  if(S.token&&!silent)fetch(S.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'logout',token:S.token})}).catch(()=>{});
  S.token='';S.user=null;sessionStorage.removeItem('sipats_tok');sessionStorage.removeItem('sipats_user');closeModal();showLogin(silent?'Sesi berakhir, silakan masuk kembali.':'');
}

// ---------- ROUTER ----------
const V={};
function go(v){
  S.view=v;const n=NAV.find(x=>x.id===v);$('viewTitle').textContent=n?n.label:'';history.replaceState(null,'','#'+v);
  document.querySelectorAll('.nav-i').forEach(a=>{const on=a.dataset.v===v;a.className='nav-i flex items-center gap-3 px-3 py-2.5 rounded text-sm '+(on?'bg-civic-600 text-white font-semibold':'text-slate-300 hover:bg-civic-850');});
  $('sidebar').classList.add('-translate-x-full');$('scrim').classList.add('hidden');
  $('main').innerHTML='<div class="text-xs text-slate-400 p-6 text-center">Memuat…</div>';
  V[v]();
}

// ---------- RINGKASAN ----------
V.ringkasan=async function(){
  const d=await act(()=>api('dashboard'));if(!d)return;
  const card=(l,v,c,ic,sub)=>`<div class="bg-white border border-slate-200 rounded-lg p-5"><div class="flex items-center justify-between"><span class="text-[11px] font-semibold uppercase tracking-wide text-slate-500">${l}</span><span class="material-symbols-outlined ${c}">${ic}</span></div><div class="text-3xl font-extrabold mt-2">${fmtN(v)}</div><div class="text-[11px] text-slate-500 mt-1">${sub}</div></div>`;
  const maxT=Math.max(1,...d.trend.map(x=>x.jumlah)), maxK=Math.max(1,...d.perKecamatan.map(x=>x.laporan+x.terverifikasi)), maxF=Math.max(1,...d.faktor.map(x=>x.jumlah));
  $('main').innerHTML=`
  ${d.overdue?`<div class="bg-ochre-50 border-l-4 border-ochre-500 rounded p-4 mb-5 flex items-center justify-between gap-3 flex-wrap"><div class="text-sm"><b class="text-ochre-700">Peringatan SLA:</b> ${fmtN(d.overdue)} laporan menunggu lebih dari 36 jam. Segera tugaskan Tim Penilik UPTD.</div><button class="${btnP}" onclick="S.q.status='PENDING';go('verifikasi')">Tindaklanjuti</button></div>`:''}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
   ${card('Laporan Masuk',d.counts.SEMUA,'text-civic-600','inbox','Total seluruh tiket')}
   ${card('Pending Survei',d.counts.PENDING,'text-amber-500','hourglass_top','Belum ditugaskan')}
   ${card('Ditindaklanjuti UPTD',d.counts.DITUGASKAN_UPTD,'text-blue-500','directions_walk','Sedang disurvei')}
   ${card('Terdata (Master)',d.masterTotal,'text-emerald-600','verified',fmtN(d.kembali)+' kembali bersekolah')}
  </div>
  <div class="grid lg:grid-cols-3 gap-5 mb-5">
   <div class="bg-white border border-slate-200 rounded-lg p-5 lg:col-span-2"><h3 class="text-sm font-bold mb-4">Laporan masuk 14 hari terakhir</h3>
    <div class="flex items-end gap-1.5 h-40">${d.trend.map(x=>`<div class="flex-1 flex flex-col items-center justify-end h-full" title="${esc(x.tanggal)}: ${x.jumlah}"><span class="text-[10px] text-slate-500">${x.jumlah||''}</span><div class="w-full bg-civic-600 rounded-t" style="height:${Math.max(x.jumlah/maxT*100,x.jumlah?4:1)}%"></div></div>`).join('')}</div>
    <div class="flex gap-1.5 mt-1">${d.trend.map(x=>`<div class="flex-1 text-center text-[9px] text-slate-400">${esc(x.tanggal.slice(8))}</div>`).join('')}</div></div>
   <div class="bg-white border border-slate-200 rounded-lg p-5"><h3 class="text-sm font-bold mb-3">Kualitas data</h3><div class="text-3xl font-extrabold">${d.nikValidPct}%</div><p class="text-[11px] text-slate-500 mt-1">Laporan dengan NIK 16 digit valid secara format. Pencocokan resmi ke SIAK Dukcapil dilakukan manual oleh verifikator.</p></div>
  </div>
  <div class="grid lg:grid-cols-2 gap-5 mb-5">
   <div class="bg-white border border-slate-200 rounded-lg p-5"><h3 class="text-sm font-bold mb-4">Sebaran per kecamatan</h3><div class="space-y-3">${d.perKecamatan.slice(0,8).map(x=>`<div><div class="flex justify-between text-xs mb-1"><span class="font-semibold">${esc(x.kecamatan)}</span><span class="font-mono text-slate-600">${x.laporan} laporan · ${x.terverifikasi} terdata</span></div><div class="h-2.5 bg-slate-100 rounded overflow-hidden"><div class="h-full bg-civic-600" style="width:${(x.laporan+x.terverifikasi)/maxK*100}%"></div></div></div>`).join('')||'<p class="text-xs text-slate-400">Belum ada data.</p>'}</div></div>
   <div class="bg-white border border-slate-200 rounded-lg p-5"><h3 class="text-sm font-bold mb-4">Faktor penyebab (dari laporan)</h3><div class="space-y-3">${d.faktor.slice(0,8).map(x=>`<div><div class="flex justify-between text-xs mb-1"><span class="font-semibold">${esc(x.faktor)}</span><span class="font-mono">${x.jumlah}</span></div><div class="h-2.5 bg-slate-100 rounded overflow-hidden"><div class="h-full bg-ochre-500" style="width:${x.jumlah/maxF*100}%"></div></div></div>`).join('')||'<p class="text-xs text-slate-400">Belum ada data.</p>'}</div></div>
  </div>
  <div class="bg-white border border-slate-200 rounded-lg p-5"><h3 class="text-sm font-bold mb-3">Aktivitas petugas terbaru</h3>${d.audit.map(a=>`<div class="flex gap-3 text-xs py-1.5 border-b border-slate-50"><span class="font-mono text-slate-400 shrink-0">${fmtDT(a.Timestamp)}</span><span><b>${esc(a.Petugas)}</b> · ${esc(a.Aksi)} ${esc(a.Detail)}</span></div>`).join('')||'<p class="text-xs text-slate-400">Belum ada aktivitas.</p>'}</div>`;
};

// ---------- VERIFIKASI ----------
let qTimer;
V.verifikasi=async function(){
  const r=await act(()=>api('queue',{status:S.q.status,search:S.q.search,kecamatan:S.q.kecamatan,page:S.q.page,pageSize:10}));if(!r)return;
  S.cache.queue=r.data;const c=r.counts;

async function exportData(type){const r=await act(()=>api('report',{type}));if(r)exportRows(r.data,type==='laporan'?'data_laporan_masuk':'master_data_ats');}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function exportRows(rows,name){
  if(!rows.length){toast('Tidak ada data untuk diekspor.',true);return;}
  const safe=v=>{v=v==null?'':String(v);return /^[=+\-@]/.test(v)?"'"+v:v;};
  const clean=rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[k]=safe(r[k]));return o;});
  const stamp=new Date().toISOString().slice(0,10);
  try{await loadXLSX();const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(clean),'Data');XLSX.writeFile(wb,`${name}_${stamp}.xlsx`);}
  catch(e){const cols=Object.keys(clean[0]);const csv='\ufeff'+[cols.join(',')].concat(clean.map(r=>cols.map(c=>'"'+String(r[c]).replace(/"/g,'""')+'"').join(','))).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${name}_${stamp}.csv`;a.click();toast('Pustaka Excel tidak termuat, diunduh sebagai CSV (dapat dibuka di Excel).');}
}

    if(t==='toggle')c=`<label class="flex items-center gap-2 text-sm"><input type="checkbox" id="c_${k}" ${v==='true'?'checked':''}> Aktif</label>`;
    else if(t==='area')c=`<textarea id="c_${k}" rows="3" class="${inp}" placeholder="${esc(d)}">${esc(v)}</textarea>`;
    else if(t.startsWith('select:'))c=`<select id="c_${k}" class="${inp}">${opt(t.slice(7).split('|'),v||d)}</select>`;
    else c=`<input id="c_${k}" class="${inp}" placeholder="${esc(d)}" value="${esc(v)}">`;
    return `<div class="${t==='area'||k.startsWith('banner')||k.endsWith('url')?'md:col-span-2':''}"><label class="${lbl}">${esc(l)}</label>${c}</div>`;}).join('')}</div></section>`).join('')}
   <div class="sticky bottom-0 bg-slate-50/90 backdrop-blur py-3 flex gap-2"><button class="${btnP}" onclick="saveCms()">Simpan Perubahan Beranda</button><a class="${btnO}" href="index.html" target="_blank">Pratinjau Beranda ↗</a></div></form>`;
};
async function saveCms(){
  const values={};CMS.forEach(s=>s.f.forEach(([k,,t])=>{const e=$('c_'+k);if(!e)return;values[k]=t==='toggle'?(e.checked?'true':''):e.value.trim();}));
  for(const k of ['hero_photo_url','hero_photo_url_2','hero_photo_url_3','hero_photo_url_4','hero_photo_url_5','catatan_foto_url']){if(values[k]&&!/^https:\/\//i.test(values[k])){toast('URL foto harus diawali https://',true);return;}}
  const r=await act(()=>api('configSave',{values}),'Beranda diperbarui.');
}

// ---------- PENGGUNA ----------
V.pengguna=async function(){
  const r=await act(()=>api('usersList'));if(!r)return;S.cache.users=r.data;
  $('main').innerHTML=`<div class="flex justify-between items-center mb-4"><p class="text-xs text-slate-500">Superadmin <span class="font-mono">admin</span> memakai ADMIN_KEY dan tidak tercantum di sini. Peran: <b>verifikator</b> (antrean & master data), <b>editor</b> (Beranda & program), <b>superadmin</b> (semua).</p><button class="${btnP}" onclick="openUser(-1)">+ Tambah Pengguna</button></div>
  <div class="bg-white border border-slate-200 rounded-lg overflow-x-auto"><table class="w-full text-xs text-left"><thead class="bg-slate-50 text-[11px] uppercase text-slate-500"><tr><th class="px-4 py-3">Username</th><th class="px-4 py-3">Nama</th><th class="px-4 py-3">Peran</th><th class="px-4 py-3">Status</th><th></th></tr></thead><tbody class="divide-y divide-slate-100">
  ${r.data.map((u,i)=>`<tr><td class="px-4 py-3 font-mono">${esc(u.Username)}</td><td class="px-4 py-3">${esc(u.Nama)}</td><td class="px-4 py-3">${esc(u.Role)}</td><td class="px-4 py-3">${u.Aktif?'Aktif':'Nonaktif'}</td><td class="px-4 py-3 text-right whitespace-nowrap"><button class="${btnO}" onclick="openUser(${i})">Ubah</button> <button class="${btnD}" onclick="delUser('${esc(u.Username)}')">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5" class="px-4 py-8 text-center text-slate-400">Belum ada pengguna tambahan.</td></tr>'}</tbody></table></div>`;
};
function openUser(i){const u=i<0?{Role:'verifikator',Aktif:true}:S.cache.users[i];
  openModal(i<0?'Tambah Pengguna':'Ubah '+u.Username,`<div class="grid grid-cols-2 gap-3"><div><label class="${lbl}">Username *</label><input id="uUser" class="${inp}" ${i>=0?'readonly':''} value="${esc(u.Username)}"></div><div><label class="${lbl}">Nama *</label><input id="uNama" class="${inp}" value="${esc(u.Nama)}"></div>
   <div><label class="${lbl}">Peran</label><select id="uRole2" class="${inp}">${opt(['verifikator','editor','superadmin'],u.Role)}</select></div><div><label class="${lbl}">Status</label><select id="uAktif" class="${inp}"><option value="1" ${u.Aktif?'selected':''}>Aktif</option><option value="0" ${u.Aktif?'':'selected'}>Nonaktif</option></select></div>
   <div class="col-span-2"><label class="${lbl}">Kata sandi ${i>=0?'(kosongkan bila tidak diganti)':'*'} — min. 8 karakter</label><input id="uPass" type="password" class="${inp}" autocomplete="new-password"></div></div>`,
  `<button class="${btnO}" onclick="closeModal()">Batal</button><button class="${btnP}" onclick="saveUser()">Simpan</button>`);}
async function saveUser(){const rec={Username:val('uUser'),Nama:val('uNama'),Role:val('uRole2'),Aktif:val('uAktif')==='1',Password:$('uPass').value};
  const r=await act(async()=>{const j=await api('usersSave',{record:rec});if(!j.success)throw new Error(j.error);return j;},'Tersimpan.');if(r){closeModal();V.pengguna();}}
async function delUser(u){if(!confirm('Hapus pengguna '+u+'?'))return;const r=await act(()=>api('usersDelete',{username:u}),'Dihapus.');if(r)V.pengguna();}

// ---------- SISTEM ----------
V.sistem=async function(){
  const a=await act(()=>api('auditList',{limit:100}));if(!a)return;
  $('main').innerHTML=`<div class="grid lg:grid-cols-3 gap-5"><div class="bg-white border border-slate-200 rounded-lg p-5 lg:col-span-1"><h3 class="text-sm font-bold mb-3">Koneksi Google Sheet</h3><div class="text-[11px] text-slate-500 mb-1">Endpoint Web App</div><div class="text-xs font-mono break-all mb-4">${esc(S.api)}</div>
   <div class="flex flex-wrap gap-2"><button class="${btnO}" onclick="testPing()">Uji Koneksi</button><button class="${btnO}" onclick="runSetup()">Perbaiki / Buat Sheet</button></div><div id="pingOut" class="text-xs mt-3 text-slate-600"></div>
   <p class="text-[11px] text-slate-500 mt-4">Tab yang dipakai: Data_Laporan_Masuk, Data_ATS_Terverifikasi, Pengaturan_Beranda, Program_Intervensi, Data_Petugas, Log_Audit_Petugas.</p></div>
   <div class="bg-white border border-slate-200 rounded-lg p-5 lg:col-span-2"><h3 class="text-sm font-bold mb-3">Log Audit Aktivitas Petugas</h3><div class="max-h-[60vh] overflow-y-auto">${a.data.map(x=>`<div class="flex gap-3 text-xs py-1.5 border-b border-slate-50"><span class="font-mono text-slate-400 shrink-0">${fmtDT(x.Timestamp)}</span><span><b>${esc(x.Petugas)}</b> · ${esc(x.Aksi)} ${esc(x.Detail)}</span></div>`).join('')||'<p class="text-xs text-slate-400">Belum ada log.</p>'}</div></div></div>`;
};
async function testPing(){const t=Date.now();const r=await act(()=>api('ping'));if(r)$('pingOut').textContent='Terhubung ✓ · '+(Date.now()-t)+' ms · zona waktu '+r.timezone;}
async function runSetup(){const r=await act(()=>api('setup'),'Struktur sheet diperiksa/dibuat.');if(r)V.sistem();}

// ---------- INIT ----------
$('btnLogin').onclick=doLogin;$('btnLogout').onclick=()=>logout(false);
$('lPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('nav').addEventListener('click',e=>{
  const link=e.target.closest('a.nav-i');
  if(!link||!S.user||!NAV.some(n=>n.id===link.dataset.v&&n.roles.includes(S.user.role))||typeof V[link.dataset.v]!=='function')return;
  e.preventDefault();go(link.dataset.v);
});
$('btnMenu').onclick=()=>{$('sidebar').classList.remove('-translate-x-full');$('scrim').classList.remove('hidden');};
$('scrim').onclick=()=>{$('sidebar').classList.add('-translate-x-full');$('scrim').classList.add('hidden');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
(async function(){
  const configuredApi=window.SIP_ATS_CONFIG&&window.SIP_ATS_CONFIG.API_URL;
  if(typeof configuredApi==='string'&&/^https:\/\/script\.google\.com\/.+\/exec\/?$/.test(configuredApi.trim()))S.api=configuredApi.trim();
  if(!S.api){$('loginErr').textContent='Konfigurasi koneksi server tidak tersedia. Hubungi pengelola situs.';$('loginErr').classList.remove('hidden');$('btnLogin').disabled=true;}
  const tok=sessionStorage.getItem('sipats_tok'),u=sessionStorage.getItem('sipats_user');
  if(tok&&u&&S.api){S.token=tok;S.user=JSON.parse(u);try{await api('me');enterApp();return;}catch(e){}}
})();
</script>
